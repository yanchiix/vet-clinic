      description: Адміністратор або ветеринар виправляє дані перед першим підтвердженням або залишає їх непідтвердженими з поясненням для клієнта; окремого стану відхиленої картки немає. confirmed=true дозволений лише з достатніми даними; confirmed=false вимагає explanation.
