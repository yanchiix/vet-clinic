      security: [{ClientAuth: []}, {StaffAuth: []}]
      responses:
        '200':
          description: Картка без медичного змісту
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pet'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    patch:
      tags: [Тварини]
      operationId: updateUnconfirmedPet
      summary: Змінити дозволені непідтверджені дані картки
      description: >-
        Клієнт може напряму змінювати основні дані лише до першого підтвердження і лише за відсутності смерті/припинення опіки. Після підтвердження клієнт використовує пропозицію змін. Адміністратор і ветеринар можуть напряму виправляти підтверджені дані: якщо змінене поле входить у нерозглянуту пропозицію, вся пропозиція відхиляється як неактуальна з причиною; інші зміни її не закривають. Після смерті/припинення опіки клієнт не редагує картку незалежно від підтвердження.
      x-requirement-ids: [REQ-F-022, REQ-F-028, REQ-F-029, REQ-F-031]
      security: [{ClientAuth: []}, {StaffAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PetPatch'}
      responses:
        '200':
          description: Дані картки змінено
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pet'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
