      responses:
        '200':
          description: Позначку виправлено
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnimalEvent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /pets/{petId}/ownership-closures/correction:
    parameters:
      - {$ref: '#/components/parameters/PetId'}
    post:
      tags: [Тварини]
      operationId: correctOwnershipClosure
      summary: Виправити позначку припинення опіки
      description: Виправлення помилкової позначки з обов’язковою причиною та історією; стан смерті не змінюється. Скасовані прийоми автоматично не відновлюються; запис і пропозиції змін знову дозволяються лише за поточного власника та відсутності смерті.
      x-requirement-ids: [REQ-F-033]
      security: [{StaffAuth: []}]
      requestBody:
        required: true
