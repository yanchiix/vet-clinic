  /staff-schedules/{staffId}/{date}:
    parameters:
      - {$ref: '#/components/parameters/StaffId'}
      - name: date
        in: path
        required: true
        schema: {type: string, format: date}
    put:
      tags: [Розклад і прийоми]
      operationId: setStaffScheduleForDate
      summary: Задати робочі інтервали на конкретну дату
      description: Лише адміністратор. Зміна перевіряє тільки підтверджені прийоми, які ще не почалися; кожен має повністю вміщатися в нові інтервали, але не зобов’язаний збігатися з новою 20-хвилинною сіткою. Час прийомів не зсувається; при перешкоді розклад не змінюється і повертається запис. Історичні прийоми не блокують зміну. Повторюваного тижневого розкладу немає.
      x-requirement-ids: [REQ-F-036, REQ-F-038]
      security: [{StaffAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkIntervals'}
            examples:
              splitDay: {value: {intervals: [{start: '09:00', end: '13:00'}, {start: '14:00', end: '18:00'}]}}
      responses:
        '200':
          description: Розклад на дату збережено
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkIntervals'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409':
          description: Наявний майбутній підтверджений прийом не вміщується; розклад не змінено
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScheduleConflict'}
              examples:
                blockingAppointment: {value: {code: schedule_conflict, message: Інтервал не вміщує підтверджений прийом., appointmentIds: [apt-204]}}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /appointment-slots:
    get:
      tags: [Розклад і прийоми]
      operationId: listAppointmentSlots
      summary: Отримати доступні інтервали прийому
      description: Формуються послідовно по 20 хвилин від початку інтервалу, повністю в його межах, без перетину та з виключенням зайнятого часу. Час Europe/Kyiv; неоднозначний або неіснуючий місцевий час не повертається.
      x-requirement-ids: [REQ-F-037, REQ-F-039, REQ-NF-003]
      security: [{ClientAuth: []}, {StaffAuth: []}]
      parameters:
        - {name: date, in: query, required: true, schema: {type: string, format: date}}
