openapi: 3.0.3
info:
  title: Veterinary Clinic API
  version: 0.1.0
  description: >-
    API-first contract based on approved SRS v0.1 and ADD-001. This specification
    models only approved behavior; unresolved OPEN/DEP decisions are not filled in.
servers:
  - url: https://api.example.invalid
tags:
  - name: Доступ
    description: Реєстрація, автентифікація та відновлення доступу.
  - name: Клієнти
    description: Профілі клієнтів та пошук.
  - name: Працівники
    description: Облікові записи працівників та їх доступність.
  - name: Тварини
    description: Картки тварин, перевірка даних та опіка.
  - name: Розклад і прийоми
    description: Робочі інтервали ветеринарів і записи на прийом.
  - name: Медична історія
    description: Медичні записи, вкладення та історія тварин.
  - name: Рекомендації
    description: Клінічні та домашні рекомендації.
  - name: Направлення
    description: Направлення ветеринарів.
paths:
  /auth/client-registrations:
    post:
      security: []
      tags: [Доступ]
      operationId: requestClientRegistrationCode
      summary: Запросити код реєстрації клієнта
      description: Починає самостійну реєстрацію; номер підтверджується окремою операцією. Код діє 5 хвилин, допускає до 5 спроб та повторне надсилання не раніше ніж через 60 секунд. Відповідь SMS-сервісу не є підтвердженням доставки; очікування відповіді обмежене 10 секундами.
      x-requirement-ids: [REQ-F-002, REQ-F-003, REQ-F-006, REQ-F-073]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientRegistrationRequest'}
            examples:
              request: {value: {firstName: Олена, lastName: Коваль, phone: '+380 (67) 123-45-67'}}
      responses:
        '202':
          description: Запит прийнято сервісом або очікує перевірки коду; доставка не гарантується
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodeRequestResult'}
              examples:
                accepted: {value: {status: requested, retryAfterSeconds: 60}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409':
          description: Номер уже належить профілю; збіг номера не надає доступу
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
              examples:
                existing: {value: {code: phone_already_registered, message: Номер уже використовується.}}
        '502': {$ref: '#/components/responses/ExternalServiceError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /auth/client-registrations/confirmation:
    post:
      security: []
      tags: [Доступ]
      operationId: confirmClientRegistration
      summary: Підтвердити реєстрацію клієнта
      description: Чинний код одноразово підтверджує номер і завершує реєстрацію зі встановленням пароля.
      x-requirement-ids: [REQ-F-003, REQ-F-006, REQ-NF-010]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientRegistrationConfirmation'}
            examples:
              valid: {value: {phone: '+380671234567', code: '123456', password: 'приклад-довгого-пароля'}}
      responses:
        '201':
          description: Профіль створено
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientProfile'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '410': {$ref: '#/components/responses/ExpiredCode'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /auth/client-sessions:
    post:
      security: []
      tags: [Доступ]
      operationId: createClientSession
      summary: Увійти як клієнт
      description: Вхід за телефоном і паролем; SMS-код для звичайного входу не потрібен.
      x-requirement-ids: [REQ-F-005, REQ-NF-011]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientLogin'}
      responses:
        '200':
          description: Вхід успішний
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /auth/staff-sessions:
    post:
      security: []
      tags: [Доступ]
      operationId: createStaffSession
      summary: Увійти як працівник
      description: Вхід за окремим логіном працівника й паролем.
      x-requirement-ids: [REQ-F-013, REQ-NF-011]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StaffLogin'}
      responses:
        '200':
          description: Вхід успішний
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /auth/client-password-resets:
    post:
      security: []
      tags: [Доступ]
      operationId: requestClientPasswordReset
      summary: Запросити код відновлення пароля клієнта
      description: Запитує SMS-код на зареєстрований номер; не розкриває наявність профілю. Код діє 5 хвилин, допускає до 5 спроб та повторне надсилання не раніше ніж через 60 секунд. Очікування відповіді SMS-сервісу обмежене 10 секундами; прийняття запиту не підтверджує доставку.
      x-requirement-ids: [REQ-F-006, REQ-F-007, REQ-F-073]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PhoneRequest'}
      responses:
        '202':
          description: Запит прийнято або не підтверджено сервісом
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodeRequestResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '502': {$ref: '#/components/responses/ExternalServiceError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /auth/client-password-resets/confirmation:
    post:
      security: []
      tags: [Доступ]
      operationId: confirmClientPasswordReset
      summary: Підтвердити код і встановити новий пароль клієнта
      description: Після успішного відновлення всі попередні сеанси клієнта завершуються.
      x-requirement-ids: [REQ-F-006, REQ-F-007, REQ-F-010]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordResetConfirmation'}
      responses:
        '204': {description: Пароль змінено; попередні сеанси завершено}
        '400': {$ref: '#/components/responses/BadRequest'}
        '410': {$ref: '#/components/responses/ExpiredCode'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /auth/client-phone-changes:
    post:
      tags: [Доступ]
      operationId: changeClientPhone
      summary: Підтвердити новий номер і змінити телефон клієнта
      description: Вимагає поточний пароль і чинний одноразовий SMS-код для нового вільного номера; старий номер лишається чинним до спільного успішного збереження. Код має правила REQ-F-006. При успіху попередні сеанси завершуються.
      x-requirement-ids: [REQ-F-006, REQ-F-008, REQ-F-010, REQ-F-073]
      security: [{ClientAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientPhoneChange'}
      responses:
        '204': {description: Номер змінено; попередні сеанси завершено}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '502': {$ref: '#/components/responses/ExternalServiceError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /auth/client-phone-changes/code-requests:
    post:
      tags: [Доступ]
      operationId: requestClientPhoneChangeCode
      summary: Запросити SMS-код для зміни номера
      description: Запитує код для нового номера в межах автентифікованої дії зміни номера. Код діє 5 хвилин, допускає до 5 спроб і прив’язаний до цієї дії; повторне надсилання можливе не раніше ніж через 60 секунд. Очікування відповіді SMS-сервісу обмежене 10 секундами; прийняття запиту не підтверджує доставку.
      x-requirement-ids: [REQ-F-006, REQ-F-008, REQ-F-073]
      security: [{ClientAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PhoneChangeCodeRequest'}
      responses:
        '202':
          description: Запит прийнято або надсилання не підтверджене
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodeRequestResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '502': {$ref: '#/components/responses/ExternalServiceError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /clients:
    post:
      tags: [Клієнти]
      operationId: createClientProfile
      summary: Створити профіль клієнта
      description: Лише адміністратор створює профіль; наявність тварини чи доступу для входу не є передумовою.
      x-requirement-ids: [REQ-F-001, REQ-F-002, REQ-F-004]
      security: [{StaffAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientProfileInput'}
      responses:
        '201':
          description: Профіль створено
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientProfile'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /clients/{clientId}:
    parameters:
      - {$ref: '#/components/parameters/ClientId'}
    get:
      tags: [Клієнти]
      operationId: getClientProfile
      summary: Отримати профіль клієнта
      description: Доступ надається відповідно до прав клієнта або працівника; медичні дані сюди не включаються. Подання профілю містить перелік пов’язаних карток тварин.
      x-requirement-ids: [REQ-F-001, REQ-F-011, REQ-F-034]
      security: [{ClientAuth: []}, {StaffAuth: []}]
      responses:
        '200':
          description: Профіль
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientProfile'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    patch:
      tags: [Клієнти]
      operationId: updateClientProfile
      summary: Змінити ім’я, прізвище або пошту клієнта
      description: Телефон змінюється лише окремою підтвердженою процедурою; ветеринар не може редагувати профіль.
      x-requirement-ids: [REQ-F-011]
      security: [{ClientAuth: []}, {StaffAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientProfilePatch'}
      responses:
        '200':
          description: Профіль змінено
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientProfile'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /clients/{clientId}/invitations:
    parameters:
      - {$ref: '#/components/parameters/ClientId'}
    post:
      tags: [Клієнти]
      operationId: createClientInvitation
      summary: Створити одноразове посилання клієнту
      description: Лише адміністратор створює посилання. Нове посилання скасовує попереднє; передавання відбувається особисто або вручну погодженим каналом, автоматичного надсилання немає.
      x-requirement-ids: [REQ-F-004]
      security: [{StaffAuth: []}]
      responses:
        '201':
          description: Одноразове посилання, чинне 24 години
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PasswordLink'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /auth/client-invitations/confirmation:
    post:
      security: []
      tags: [Доступ]
      operationId: setClientPasswordFromInvitation
      summary: Встановити пароль за запрошенням
      description: Використовує одноразове посилання для вже створеного профілю клієнта.
      x-requirement-ids: [REQ-F-004, REQ-NF-010]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordLinkCompletion'}
      responses:
        '204': {description: Пароль встановлено}
        '400': {$ref: '#/components/responses/BadRequest'}
        '410': {$ref: '#/components/responses/ExpiredLink'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /auth/client-access-recoveries:
    post:
      tags: [Доступ]
      operationId: recordClientAccessRecoveryReview
      summary: Зафіксувати особисту перевірку для відновлення доступу
      description: Лише адміністратор зберігає результат, час та власне рішення. Негативний результат не дозволяє продовжити процес; за позитивного система створює одноразове посилання на 24 години й повертає його секретне значення для передачі клієнту. Копії й реквізити документа не зберігаються; достатність доказів визначається поза цим контрактом за DEP-004.
      x-requirement-ids: [REQ-F-009]
      security: [{StaffAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecoveryReviewInput'}
      responses:
        '201':
          description: Результат перевірки зафіксовано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecoveryReview'}
        '400': {$ref: '#/components/responses/BadRequest'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /client-access-recoveries/{recoveryId}/phone-confirmation:
    parameters:
      - {$ref: '#/components/parameters/RecoveryId'}
    post:
      security: []
      tags: [Доступ]
      operationId: confirmRecoveryPhone
      summary: Підтвердити новий номер у відновленні
      description: SMS-код і підтвердження прив’язані до профілю, номера й операції та чинного одноразового посилання. Код діє 5 хвилин, допускає до 5 спроб; повторне надсилання можливе не раніше ніж через 60 секунд.
      x-requirement-ids: [REQ-F-006, REQ-F-009, REQ-F-073]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecoveryPhoneConfirmation'}
      responses:
        '200':
          description: Номер підтверджено до завершення строку посилання
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecoveryReview'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '410': {$ref: '#/components/responses/ExpiredCode'}
        '502': {$ref: '#/components/responses/ExternalServiceError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /client-access-recoveries/{recoveryId}/phone-code-requests:
    parameters:
      - {$ref: '#/components/parameters/RecoveryId'}
    post:
      security: []
      tags: [Доступ]
      operationId: requestRecoveryPhoneCode
      summary: Запросити SMS-код для відновлення доступу
      description: Запитує код для нового вільного номера в межах конкретної позитивної перевірки й чинного одноразового посилання. Код діє 5 хвилин, допускає до 5 спроб; повторне надсилання можливе не раніше ніж через 60 секунд. Очікування SMS-сервісу — до 10 секунд; доставка не гарантується. Повторний запит замінює лише код, не посилання.
      x-requirement-ids: [REQ-F-006, REQ-F-009, REQ-F-073]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecoveryPhoneCodeRequest'}
      responses:
        '202':
          description: Запит прийнято або надсилання не підтверджене
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodeRequestResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '410': {$ref: '#/components/responses/ExpiredLink'}
        '502': {$ref: '#/components/responses/ExternalServiceError'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /client-access-recoveries/{recoveryId}/completion:
    parameters:
      - {$ref: '#/components/parameters/RecoveryId'}
    post:
      security: []
      tags: [Доступ]
      operationId: completeClientAccessRecovery
      summary: Завершити відновлення доступу клієнта
      description: За чинним посиланням і підтвердженим для цієї операції вільним номером атомарно змінює номер та пароль; перед збереженням номер перевіряється повторно. До успіху старі дані не змінюються.
      x-requirement-ids: [REQ-F-009, REQ-F-010, REQ-NF-010]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecoveryCompletion'}
      responses:
        '204': {description: Доступ відновлено; попередні сеанси завершено}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/ExpiredLink'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /staff-accounts:
    post:
      tags: [Працівники]
      operationId: createStaffAccount
      summary: Створити обліковий запис працівника
      description: Лише адміністратор створює адміністратора або ветеринара; відкрита реєстрація працівників відсутня.
      x-requirement-ids: [REQ-F-012, REQ-F-013, REQ-F-018]
      security: [{StaffAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StaffAccountInput'}
      responses:
        '201':
          description: Обліковий запис створено
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffAccount'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /staff-accounts/{staffId}:
    parameters:
      - {$ref: '#/components/parameters/StaffId'}
    patch:
      tags: [Працівники]
      operationId: changeStaffAccountAvailability
      summary: Заблокувати або розблокувати працівника
      description: Лише адміністратор блокує або розблоковує працівника. Роль незмінна. Блокування завершує активні сеанси; заборонено самоблокування та блокування останнього незаблокованого адміністратора, який установив пароль.
      x-requirement-ids: [REQ-F-015, REQ-F-016, REQ-F-017, REQ-F-018]
      security: [{StaffAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StaffAvailabilityChange'}
      responses:
        '200':
          description: Запис працівника змінено
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffAccount'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /staff-accounts/{staffId}/password-links:
    parameters:
      - {$ref: '#/components/parameters/StaffId'}
    post:
      tags: [Працівники]
      operationId: createStaffPasswordLink
      summary: Створити одноразове посилання працівнику
      description: Лише адміністратор створює посилання для первинного пароля або відновлення; нове скасовує попереднє. OPEN-003 не розв’язується цим API.
      x-requirement-ids: [REQ-F-014]
      security: [{StaffAuth: []}]
      responses:
        '201':
          description: Посилання чинне 24 години
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PasswordLink'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /auth/staff-password-links/confirmation:
    post:
      security: []
      tags: [Доступ]
      operationId: setStaffPasswordFromLink
      summary: Встановити пароль працівника за посиланням
      description: Працівник сам установлює первинний або новий пароль; відновлення завершує попередні сеанси.
      x-requirement-ids: [REQ-F-014, REQ-F-010, REQ-NF-010]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordLinkCompletion'}
      responses:
        '204': {description: Пароль встановлено; при відновленні попередні сеанси завершено}
