      x-requirement-ids: [REQ-F-030, REQ-F-031, REQ-F-032]
      security: [{StaffAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AnimalEventInput'}
      responses:
        '201':
          description: Подію зафіксовано; застосовано визначені SRS наслідки
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnimalEvent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        default: {$ref: '#/components/responses/UnexpectedError'}
  /pets/{petId}/deaths/correction:
